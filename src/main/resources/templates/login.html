<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Online Library Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            background-color: #0f0f0f;
            font-family: "Segoe UI", sans-serif;
            color: white;
        }

        .login-container {
            min-height: 100vh;
        }

        .login-card {
            width: 400px;
            background-color: #ffffff;
            border-radius: 15px;
            padding: 40px;
            color: black;
        }

        .library-title {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .library-subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        .form-control {
            height: 50px;
            border-radius: 10px;
        }

        .form-control:focus {
            border-color: black;
            box-shadow: none;
        }

        .btn-login {
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
            background-color: black;
            color: white;
            transition: 0.3s;
        }

        .btn-login:hover {
            background-color: #222;
            color: white;
        }

        .book-icon {
            font-size: 50px;
        }

    </style>
</head>

<body>

<div class="container login-container d-flex justify-content-center align-items-center">

    <div class="login-card shadow-lg">

        <div class="text-center mb-4">

            <h1 class="library-title">Online Library</h1>

            <p class="library-subtitle">
                Library Management System
            </p>

        </div>

        <!-- login error -->
        <div th:if="${loginError}" class="alert alert-danger text-center">
            <span th:text="${loginError}"></span>
        </div>

        <!-- logout success -->
        <div th:if="${param.logout}" class="alert alert-success text-center">
            Logged out successfully
        </div>

        <form th:action="@{/login}" method="post">

            <input type="text"
                   name="username"
                   placeholder="Enter Username"
                   class="form-control mb-3"
                   required/>

            <input type="password"
                   name="password"
                   placeholder="Enter Password"
                   class="form-control mb-4"
                   required/>

            <button type="submit"
                    class="btn btn-login w-100">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
